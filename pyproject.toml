[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-agent"
version = "0.1.0"
description = "GTM email agent that recruits oncology fellows for product user studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.42"]
dev = ["pytest>=8.0"]

[project.scripts]
gtm-agent = "gtm_agent.cli:app"

[tool.setuptools.packages.find]
include = ["gtm_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
